<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account | GHOSH ONLINE CENTRE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(37,99,235,.35),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(14,165,233,.25),transparent 35%),
    linear-gradient(135deg,#061a3a,#0b4ea2 55%,#0ea5e9);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

.register-wrap{
  width:100%;
  max-width:470px;
}

.brand{
  text-align:center;
  color:white;
  margin-bottom:18px;
}

.brand-logo{
  width:68px;
  height:68px;
  object-fit:contain;
  background:white;
  border-radius:18px;
  padding:8px;
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}

.brand h2{
  margin:10px 0 3px;
  font-size:21px;
  font-weight:800;
}

.brand p{
  margin:0;
  opacity:.85;
  font-size:13px;
}

.register-card{
  background:rgba(255,255,255,.98);
  border-radius:24px;
  padding:30px 28px;
  box-shadow:0 25px 70px rgba(0,0,0,.28);
}

.register-card h1{
  margin:0;
  text-align:center;
  color:#0f2f63;
  font-size:27px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin:8px 0 24px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#26364d;
  font-size:14px;
  font-weight:700;
}

.field input{
  width:100%;
  height:50px;
  border:1px solid #d6e0ec;
  border-radius:12px;
  padding:0 15px;
  font-size:15px;
  outline:none;
  background:#f8fafc;
}

.field input:focus{
  background:white;
  border-color:#1689ef;
  box-shadow:0 0 0 4px rgba(22,137,239,.12);
}

.create-btn{
  width:100%;
  height:52px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#0757d9,#1689ef);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(7,87,217,.25);
  margin-top:5px;
}

.msg{
  text-align:center;
  margin:13px 0 0;
  font-size:14px;
  font-weight:600;
}

.bottom{
  text-align:center;
  margin:20px 0 0;
  color:#64748b;
  font-size:14px;
}

.bottom a{
  color:#0757d9;
  font-weight:800;
  text-decoration:none;
}

.home{
  display:block;
  text-align:center;
  margin-top:17px;
  color:white;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

@media(max-width:480px){
  .register-card{
    padding:27px 21px;
    border-radius:20px;
  }

  .brand-logo{
    width:62px;
    height:62px;
  }
}
</style>
</head>

<body>

<div class="register-wrap">

  <div class="brand">
    <img src="logo.png" class="brand-logo" alt="Ghosh Online Centre">
    <h2>GHOSH ONLINE CENTRE</h2>
    <p>Digital Services Under One Roof</p>
  </div>

  <div class="register-card">

    <h1>Create Account</h1>

    <p class="subtitle">
      আপনার Customer Account তৈরি করুন
    </p>

    <form id="registerForm">

      <div class="field">
        <label>Customer Name</label>
        <input
          id="name"
          type="text"
          required
          placeholder="আপনার নাম">
      </div>

      <div class="field">
        <label>Mobile Number</label>
        <input
          id="mobile"
          type="tel"
          inputmode="numeric"
          maxlength="10"
          required
          placeholder="10 digit mobile number">
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="password"
          type="password"
          required
          placeholder="Password">
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          required
          placeholder="Password আবার লিখুন">
      </div>

      <button class="create-btn" type="submit">
        Create Account
      </button>

    </form>

    <p id="msg" class="msg"></p>

    <p class="bottom">
      আগে থেকেই Account আছে?
      <a href="login.html">Login করুন</a>
    </p>

  </div>

  <a class="home" href="index.html">← Back to Home</a>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit",function(e){

  e.preventDefault();

  const name=document.getElementById("name").value.trim();
  const mobile=document.getElementById("mobile").value.trim();
  const password=document.getElementById("password").value;
  const confirmPassword=document.getElementById("confirmPassword").value;
  const msg=document.getElementById("msg");

  if(mobile.length!==10){
    msg.style.color="#dc2626";
    msg.textContent="সঠিক 10 digit Mobile Number দিন।";
    return;
  }

  if(password!==confirmPassword){
    msg.style.color="#dc2626";
    msg.textContent="Password মিলছে না।";
    return;
  }

  let users=JSON.parse(
    localStorage.getItem("ghosh_users") || "[]"
  );

  const exists=users.some(function(u){
    return u.mobile===mobile;
  });

  if(exists){
    msg.style.color="#dc2626";
    msg.textContent="এই Mobile Number দিয়ে Account আগে থেকেই আছে।";
    return;
  }

  const user={
    name:name,
    mobile:mobile,
    password:password
  };

  users.push(user);

  localStorage.setItem(
    "ghosh_users",
    JSON.stringify(users)
  );

  msg.style.color="#16a34a";
  msg.textContent="Account তৈরি হয়েছে। Login করা হচ্ছে...";

  setTimeout(function(){
    window.location.href="login.html";
  },1000);

});
</script>

</body>
</html>
