<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#eef6ff;font-family:Arial,sans-serif}
.auth-card{width:100%;max-width:440px;background:#fff;padding:35px 30px;border-radius:22px;box-shadow:0 20px 60px #0002}
.auth-card h1{text-align:center;color:#0f3b82}
.auth-card input{width:100%;height:50px;box-sizing:border-box;margin:8px 0;border:1px solid #d8e2ef;border-radius:11px;padding:0 14px}
.auth-card .btn.full{width:100%;height:50px;margin-top:14px;border:0;border-radius:11px;background:#0757d9;color:#fff;font-weight:700}
</style><!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Login | GHOSH ONLINE CENTRE</title>
<link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

<div class="auth-card">

<h1>Customer Login</h1>
<p>আপনার Customer Account-এ প্রবেশ করুন</p>

<form id="loginForm">

<label>Mobile Number</label>
<input
id="mobile"
type="tel"
inputmode="numeric"
maxlength="10"
required
placeholder="10 digit mobile number">

<label>Password</label>
<input
id="password"
type="password"
required
placeholder="Password">

<button class="btn full" type="submit">
Login
</button>

</form>

<p>
নতুন Customer?
<a href="register.html">Create Account</a>
</p>

<p id="msg" class="msg"></p>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){

e.preventDefault();

const users = JSON.parse(
localStorage.getItem("ghosh_users") || "[]"
);

const mobileNumber =
document.getElementById("mobile").value.trim();

const password =
document.getElementById("password").value;

const user = users.find(function(u){
return u.mobile === mobileNumber &&
u.password === password;
});

if(user){

localStorage.setItem(
"ghosh_current_user",
JSON.stringify(user)
);

window.location.href = "dashboard.html";

}else{

document.getElementById("msg").textContent =
"Mobile number অথবা Password ভুল।";

}

});
</script>

</body>
</html>
