<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Login | GHOSH ONLINE CENTRE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(37,99,235,.35),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(14,165,233,.25),transparent 35%),
    linear-gradient(135deg,#061a3a,#0b4ea2 55%,#0ea5e9);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

.login-wrap{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  color:white;
  margin-bottom:20px;
}

.brand-logo{
  width:72px;
  height:72px;
  object-fit:contain;
  background:white;
  border-radius:18px;
  padding:8px;
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}

.brand h2{
  margin:12px 0 3px;
  font-size:22px;
  font-weight:800;
}

.brand p{
  margin:0;
  opacity:.85;
  font-size:13px;
}

.login-card{
  background:rgba(255,255,255,.98);
  border-radius:24px;
  padding:32px 28px;
  box-shadow:0 25px 70px rgba(0,0,0,.28);
}

.login-card h1{
  margin:0;
  text-align:center;
  color:#0f2f63;
  font-size:28px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin:8px 0 26px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#26364d;
  font-size:14px;
  font-weight:700;
}

.field input{
  width:100%;
  height:52px;
  border:1px solid #d6e0ec;
  border-radius:12px;
  padding:0 15px;
  font-size:15px;
  outline:none;
  background:#f8fafc;
  transition:.2s;
}

.field input:focus{
  background:white;
  border-color:#1689ef;
  box-shadow:0 0 0 4px rgba(22,137,239,.12);
}

.login-btn{
  width:100%;
  height:52px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#0757d9,#1689ef);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(7,87,217,.25);
}

.login-btn:active{
  transform:scale(.99);
}

.bottom{
  text-align:center;
  margin:22px 0 0;
  color:#64748b;
  font-size:14px;
}

.bottom a{
  color:#0757d9;
  font-weight:800;
  text-decoration:none;
}

.home{
  display:block;
  text-align:center;
  margin-top:18px;
  color:white;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.msg{
  text-align:center;
  margin-top:14px;
  color:#dc2626;
  font-size:14px;
}

@media(max-width:480px){
  .login-card{
    padding:28px 22px;
    border-radius:20px;
  }

  .brand-logo{
    width:64px;
    height:64px;
  }
}
</style>
</head>

<body>

<div class="login-wrap">

  <div class="brand">
    <img src="logo.png" class="brand-logo" alt="Ghosh Online Centre">
    <h2>GHOSH ONLINE CENTRE</h2>
    <p>Digital Services Under One Roof</p>
  </div>

  <div class="login-card">

    <h1>Customer Login</h1>

    <p class="subtitle">
      আপনার Customer Account-এ প্রবেশ করুন
    </p>

    <form id="loginForm">

      <div class="field">
        <label>Mobile Number</label>
        <input
          id="mobile"
          type="tel"
          inputmode="numeric"
          maxlength="10"
          required
          placeholder="10 digit mobile number">
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="password"
          type="password"
          required
          placeholder="Password">
      </div>

      <button class="login-btn" type="submit">
        Login
      </button>

    </form>

    <p id="msg" class="msg"></p>

    <p class="bottom">
      নতুন Customer?
      <a href="register.html">Create Account</a>
    </p>

  </div>

  <a class="home" href="index.html">← Back to Home</a>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();

  const users=JSON.parse(
    localStorage.getItem("ghosh_users") || "[]"
  );

  const mobileNumber=
    document.getElementById("mobile").value.trim();

  const password=
    document.getElementById("password").value;

  const user=users.find(function(u){
    return u.mobile===mobileNumber &&
           u.password===password;
  });

  if(user){
    localStorage.setItem(
      "ghosh_current_user",
      JSON.stringify(user)
    );

    window.location.href="dashboard.html";
  }else{
    document.getElementById("msg").textContent=
      "Mobile number অথবা Password ভুল!";
  }
});
</script>

</body>
</html>
